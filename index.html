<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Analytics Dashboard</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #12141d; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: #1e222d; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-group { margin-bottom: 15px; }
        .btn { background: #2962ff; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-right: 10px; }
        .btn.active { background: #00b0ff; border: 2px solid #fff; }
        .status { font-size: 24px; font-weight: bold; }
        .buy { color: #0ecb81; }
        .sell { color: #f6465d; }
        .neutral { color: #9b9b9b; }
        #chart { height: 400px; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="btn-group">
                <button class="btn active" onclick="switchPair('BTCUSD', this)">BTC/USD</button>
                <button class="btn" onclick="switchPair('XAUUSD', this)">XAU/USD</button>
            </div>
            <h2 id="asset-title">⚡ BTC/USD Analytics</h2>
            <div id="signal-box" class="status neutral">SIGNAL: LOADING...</div>
            <p id="reason-box">Analisis indikator sedang memproses...</p>
            <p><strong>Harga Real-time:</strong> $<span id="price">-</span> | <strong>RSI:</strong> <span id="rsi">-</span></p>
        </div>
        <div class="card">
            <div id="chart"></div>
        </div>
    </div>

    <script>
        let currentPair = 'BTCUSD';
        const PAIR_MAP = { 'BTCUSD': 'BTCUSDT', 'XAUUSD': 'PAXGUSDT' };

        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: { backgroundColor: '#1e222d', textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } }
        });
        const candleSeries = chart.addCandlestickSeries();

        function calculateRSI(closes, period = 14) {
            if (closes.length < period + 1) return 50;
            let gains = 0, losses = 0;
            for (let i = closes.length - period; i < closes.length; i++) {
                let diff = closes[i] - closes[i - 1];
                if (diff >= 0) gains += diff;
                else losses -= diff;
            }
            let avgGain = gains / period;
            let avgLoss = losses / period;
            if (avgLoss === 0) return 100;
            let rs = avgGain / avgLoss;
            return (100 - (100 / (1 + rs))).toFixed(2);
        }

        function calculateBollinger(closes, period = 20, stdDev = 2) {
            let slice = closes.slice(-period);
            let mean = slice.reduce((a, b) => a + b, 0) / period;
            let variance = slice.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / period;
            let sd = Math.sqrt(variance);
            return { upper: mean + (sd * stdDev), lower: mean - (sd * stdDev) };
        }

        function switchPair(pair, btn) {
            currentPair = pair;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('asset-title').innerText = `⚡ ${pair.replace('USD', '/USD')} Analytics`;
            updateDashboard();
        }

        async function updateDashboard() {
            try {
                let symbol = PAIR_MAP[currentPair];
                let res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=5m&limit=100`);
                let rawData = await res.json();

                let candles = [];
                let closes = [];

                rawData.forEach(item => {
                    let closePrice = parseFloat(item[4]);
                    closes.push(closePrice);
                    candles.push({
                        time: Math.floor(item[0] / 1000),
                        open: parseFloat(item[1]),
                        high: parseFloat(item[2]),
                        low: parseFloat(item[3]),
                        close: closePrice
                    });
                });

                candleSeries.setData(candles);

                let currentPrice = closes[closes.length - 1];
                let rsi = calculateRSI(closes);
                let bb = calculateBollinger(closes);

                let signal = "NEUTRAL";
                let reason = "Pasar berada di area konsolidasi / normal.";

                if (currentPrice <= bb.lower && rsi < 40) {
                    signal = "BUY / CALL 🟢";
                    reason = "Harga tembus Lower BB + RSI Oversold.";
                } else if (currentPrice >= bb.upper && rsi > 60) {
                    signal = "SELL / PUT 🔴";
                    reason = "Harga tembus Upper BB + RSI Overbought.";
                }

                let signalBox = document.getElementById('signal-box');
                signalBox.innerText = `SIGNAL: ${signal}`;
                signalBox.className = 'status ' + (signal.includes('BUY') ? 'buy' : signal.includes('SELL') ? 'sell' : 'neutral');

                document.getElementById('reason-box').innerText = `Reason: ${reason}`;
                document.getElementById('price').innerText = currentPrice;
                document.getElementById('rsi').innerText = rsi;
            } catch (e) {
                console.error("Fetch Error:", e);
                document.getElementById('signal-box').innerText = "SIGNAL: ERROR FETCHING DATA";
            }
        }

        setInterval(updateDashboard, 5000);
        updateDashboard();
    </script>
</body>
</html>
